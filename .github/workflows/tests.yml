name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Also run the tests marked slow"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]" pytest-xdist pytest-timeout
      # The MINLPLib instances are gitignored (fetch.py downloads them); cache them so
      # minlplib.org is hit only when the selection changes. Without them ~20 tests skip.
      - name: Cache MINLPLib instances
        id: minlplib
        uses: actions/cache@v4
        with:
          path: |
            benchmarks/minlplib/nl
            benchmarks/minlplib/gms
            benchmarks/minlplib/instancedata.csv
          key: minlplib-${{ hashFiles('benchmarks/minlplib/fetch.py', 'benchmarks/minlplib/instances*.csv') }}
      - name: Fetch MINLPLib instances
        if: steps.minlplib.outputs.cache-hit != 'true'
        run: |
          python benchmarks/minlplib/fetch.py
          python benchmarks/minlplib/fetch.py --integer
      # tests/conftest.py caches XLA executables and jaxglobal kernels in .jax_cache/;
      # carrying it between runs skips most compiles. Kernels from older sources are
      # keyed on a source hash and never reused, so a partial restore is safe.
      - name: Restore compiled kernels
        uses: actions/cache/restore@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ hashFiles('jaxglobal/**/*.py', 'tests/**/*.py', 'pyproject.toml') }}
          restore-keys: jax-cache-
      - name: Run tests
        # Tests that take >= 1 s (tests/slow_tests.txt) run only on a manual dispatch with
        # "all"; the full suite, fuzz and check_wrong are pre-merge gates run locally.
        run: >-
          python -m pytest -q -ra -n auto --timeout 600 --durations=40 --durations-min=3
          ${{ inputs.all && ' ' || '-m "not slow"' }} tests
      # Saved even when a test fails, so the next run starts warm.
      - name: Save compiled kernels
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ hashFiles('jaxglobal/**/*.py', 'tests/**/*.py', 'pyproject.toml') }}
