'14.0s' repeatCount='indefinite' keyTimes='0.00000;0.09643;0.11429;0.13929;0.15714;0.28571;0.29643;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>2 · the node's bound certificate is an affine minorant of f<animate attributeName='opacity' dur='14.0s' repeatCount='indefinite' keyTimes='0.00000;0.09643;0.11429;0.30357;0.32143;0.48571;0.49643;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>3 · past x* the minorant already exceeds UB<animate attributeName='opacity' dur='14.0s' repeatCount='indefinite' keyTimes='0.00000;0.09643;0.11429;0.50357;0.52143;0.70714;0.71786;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>4 · so x > x* is cut from the node: free, from duals already computed<animate attributeName='opacity' dur='14.0s' repeatCount='indefinite' keyTimes='0.00000;0.09643;0.11429;0.72500;0.74286;0.96429;0.97500;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text></svg>
