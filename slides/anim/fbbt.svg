<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 440' width='960' height='440' font-family='Helvetica, Arial, sans-serif'><title>FBBT animation</title><rect width='960' height='440' fill='white'/><defs><marker id='ab' markerWidth='16' markerHeight='16' refX='8' refY='8' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L16,8 L0,16 Z' fill='#1c5cab'/></marker><marker id='ao' markerWidth='16' markerHeight='16' refX='8' refY='8' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L16,8 L0,16 Z' fill='#d9822b'/></marker></defs><text x='30.0' y='34.0' font-size='19' fill='#1d1d1b' text-anchor='start' font-weight='bold'>constraint  x + y² ≤ 2,   box  x ∈ [0, 5],  y ∈ [−2, 2]</text><line x1='110' y1='300' x2='220' y2='110' stroke='#9aa3ad' stroke-width='2'/><line x1='330' y1='200' x2='220' y2='110' stroke='#9aa3ad' stroke-width='2'/><line x1='330' y1='300' x2='330' y2='200' stroke='#9aa3ad' stroke-width='2'/><circle cx='110' cy='300' r='26' fill='#eef4fc' stroke='#1c5cab' stroke-width='2'/><text x='110.0' y='306.0' font-size='20' fill='#1c5cab' text-anchor='middle' font-weight='bold'>x</text><circle cx='330' cy='300' r='26' fill='#eef4fc' stroke='#1c5cab' stroke-width='2'/><text x='330.0' y='306.0' font-size='20' fill='#1c5cab' text-anchor='middle' font-weight='bold'>y</text><circle cx='330' cy='200' r='26' fill='#eef4fc' stroke='#1c5cab' stroke-width='2'/><text x='330.0' y='206.0' font-size='20' fill='#1c5cab' text-anchor='middle' font-weight='bold'>( )²</text><circle cx='220' cy='110' r='26' fill='#eef4fc' stroke='#1c5cab' stroke-width='2'/><text x='220.0' y='116.0' font-size='20' fill='#1c5cab' text-anchor='middle' font-weight='bold'>+</text><text x='220.0' y='58.0' font-size='20' fill='#c0392b' text-anchor='middle' font-weight='bold'>≤ 2</text><line x1='220' y1='64' x2='220' y2='84' stroke='#c0392b' stroke-width='2'/><text x='60' y='350' font-size='18' fill='#1c5cab' text-anchor='start' font-weight='bold' opacity='0'>[0, 5]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.11875;0.14062;0.53750;0.55937;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='290' y='350' font-size='18' fill='#1c5cab' text-anchor='start' font-weight='bold' opacity='0'>[−2, 2]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.11875;0.14062;0.63750;0.65937;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='368' y='205' font-size='18' fill='#1c5cab' text-anchor='start' font-weight='bold' opacity='0'>[0, 4]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.20000;0.22188;0.57500;0.59687;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='262' y='115' font-size='18' fill='#1c5cab' text-anchor='start' font-weight='bold' opacity='0'>[0, 9]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.28750;0.30938;0.38750;0.40937;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='262' y='115' font-size='18' fill='#c0392b' text-anchor='start' font-weight='bold' opacity='1'>[0, 2]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.38750;0.40937;0.99938;1.00000' values='1;1;0;0;1;1;1' calcMode='linear'/></text><text x='60' y='350' font-size='18' fill='#d9822b' text-anchor='start' font-weight='bold' opacity='1'>[0, 2]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.53750;0.55937;0.99938;1.00000' values='1;1;0;0;1;1;1' calcMode='linear'/></text><text x='368' y='205' font-size='18' fill='#d9822b' text-anchor='start' font-weight='bold' opacity='1'>[0, 2]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.57500;0.59687;0.99938;1.00000' values='1;1;0;0;1;1;1' calcMode='linear'/></text><text x='290' y='350' font-size='18' fill='#d9822b' text-anchor='start' font-weight='bold' opacity='1'>[−1.41, 1.41]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.63750;0.65937;0.99938;1.00000' values='1;1;0;0;1;1;1' calcMode='linear'/></text><g opacity='0'><animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.11875;0.14062;0.37500;0.39687;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/><path d='M455,330 L455,130' stroke='#1c5cab' stroke-width='4' marker-end='url(#ab)'/><text x='468.0' y='230.0' font-size='17' fill='#1c5cab' text-anchor='start' font-weight='normal'>forward</text></g><g opacity='0'><animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.47500;0.49687;0.70000;0.72187;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/><path d='M455,120 L455,320' stroke='#d9822b' stroke-width='4' marker-end='url(#ao)'/><text x='468.0' y='230.0' font-size='17' fill='#d9822b' text-anchor='start' font-weight='normal'>backward</text></g><text x='30.0' y='385.0' font-size='16' fill='#d9822b' text-anchor='start' font-weight='normal'>x ∈ [0,2] − [0,4]  →  x ≤ 2;     y² ∈ [0,2] − [0,2]  →  |y| ≤ √2<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.53750;0.55937;0.99938;1.00000' values='1;1;0;0;1;1;1' calcMode='linear'/></text><path d='M560.00,303.34 L560.00,303.34 L568.80,300.17 L577.29,297.01 L585.48,293.85 L593.37,290.68 L600.95,287.52 L608.23,284.35 L615.21,281.19 L621.89,278.03 L628.26,274.86 L634.32,271.70 L640.09,268.53 L645.55,265.37 L650.70,262.21 L655.56,259.04 L660.11,255.88 L664.36,252.71 L668.30,249.55 L671.94,246.39 L675.28,243.22 L678.31,240.06 L681.04,236.89 L683.47,233.73 L685.59,230.57 L687.41,227.40 L688.93,224.24 L690.14,221.07 L691.05,217.91 L691.66,214.75 L691.96,211.58 L691.96,208.42 L691.66,205.25 L691.05,202.09 L690.14,198.93 L688.93,195.76 L687.41,192.60 L685.59,189.43 L683.47,186.27 L681.04,183.11 L678.31,179.94 L675.28,176.78 L671.94,173.61 L668.30,170.45 L664.36,167.29 L660.11,164.12 L655.56,160.96 L650.70,157.79 L645.55,154.63 L640.09,151.47 L634.32,148.30 L628.26,145.14 L621.89,141.97 L615.21,138.81 L608.23,135.65 L600.95,132.48 L593.37,129.32 L585.48,126.15 L577.29,122.99 L568.80,119.83 L560.00,116.66 L560.00,116.66 Z' fill='#2e8b57' fill-opacity='0.25' stroke='#2e8b57' stroke-width='1.5'/><text x='573.2' y='180.3' font-size='15' fill='#2e8b57' text-anchor='start' font-weight='normal'>feasible</text><line x1='560' y1='368.4' x2='560' y2='51.599999999999994' stroke='#9aa3ad'/><line x1='540.2' y1='210' x2='916.4000000000001' y2='210' stroke='#9aa3ad'/><text x='906.5' y='233.1' font-size='16' fill='#9aa3ad' text-anchor='start' font-weight='normal'>x</text><text x='536.9' y='64.8' font-size='16' fill='#9aa3ad' text-anchor='start' font-weight='normal'>y</text><rect x='560' y='116.7' width='132.0' height='186.7' fill='none' stroke='#1c5cab' stroke-width='3'><animate attributeName='y' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.71250;0.82500;1.00000' values='116.7;116.7;78.0;78.0;116.7;116.7' calcMode='linear'/><animate attributeName='width' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.71250;0.82500;1.00000' values='132.0;132.0;330.0;330.0;132.0;132.0' calcMode='linear'/><animate attributeName='height' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.71250;0.82500;1.00000' values='186.7;186.7;264.0;264.0;186.7;186.7' calcMode='linear'/></rect><text x='698.6' y='101.1' font-size='15' fill='#1c5cab' text-anchor='start' font-weight='normal'>72% of the box removed<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.82500;0.84687;0.99938;1.00000' values='1;1;0;0;1;1;1' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1c5cab' text-anchor='middle' font-weight='bold' opacity='1'>FBBT: forward–backward interval propagation on the jaxpr, every node<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.97500;1.00000' values='1;1;0;0;1' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>1 · forward: interval of every node, leaves to root<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.12188;0.13750;0.37500;0.38438;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>2 · the constraint clamps the root: [0, 9] → [0, 2]<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.39062;0.40625;0.47500;0.48438;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>3 · backward: invert each operation to narrow its inputs<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.49062;0.50625;0.70625;0.71562;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>4 · the box shrinks before any branching<animate attributeName='opacity' dur='16.0s' repeatCount='indefinite' keyTimes='0.00000;0.08438;0.10000;0.72188;0.73750;0.96875;0.97813;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text></svg>
