000;0.07941;0.09412;0.25588;0.27059;0.79412;0.80294;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text><text x='480.0' y='420' font-size='19' fill='#1d1d1b' text-anchor='middle' opacity='0'>3 · each result is a weak-duality certificate, so the new box is valid<animate attributeName='opacity' dur='17.0s' repeatCount='indefinite' keyTimes='0.00000;0.07941;0.09412;0.80882;0.82353;0.97059;0.97941;1.00000' values='0;0;0;0;1;1;0;0' calcMode='linear'/></text></svg>
