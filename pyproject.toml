[project]
name = "jaxglobal"
version = "0.1.0"
description = "Deterministic global optimization of plain JAX functions via jaxpr-derived relaxations"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "John R. Kitchin", email = "jkitchin@andrew.cmu.edu"}]
# jax >= 0.11.2: older jaxlib segfaults running a jax.export-deserialized kernel
# with LAPACK calls in a fresh process (kcache.py); jax < 0.12: 0.12 lowers erfc with
# bitcast_convert_type, which has no relaxation rule; flatbuffers: jax.export serialization
dependencies = ["jax>=0.11.2,<0.12", "numpy", "scipy", "optax", "flatbuffers"]

[project.optional-dependencies]
pounce = ["pounce-solver>=0.12"]  # default local NLP solver when installed
dev = ["pytest", "matplotlib", "mpmath", "pounce-solver>=0.12", "pyomo"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocs-jupyter>=0.25", "mkdocstrings[python]>=0.26"]  # also docs-site/requirements.txt

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jaxglobal", "jaxglobal.applications"]

[tool.setuptools.package-data]
"jaxglobal.applications" = ["data/*.npz"]
