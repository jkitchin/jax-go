[project]
name = "jaxglobal"
version = "0.0.1"
description = "Proof-of-concept deterministic global optimization of plain JAX functions via jaxpr-derived relaxations"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy", "scipy", "optax"]

[project.optional-dependencies]
pounce = ["pounce-solver>=0.12"]  # default local NLP solver when installed
dev = ["pytest", "matplotlib", "pounce-solver>=0.12"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jaxglobal"]
